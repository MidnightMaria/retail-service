server:
  port: 8081
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: retail-service

  datasource:
    url: jdbc:postgresql://postgres:5432/${RETAIL_DB:retail_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      INDENT_OUTPUT: true

# 🔗 Komunikasi antar service (dengan Inventory)
inventory:
  api:
    url: ${INVENTORY_API_URL:http://inventory-service:8080}

# 🩺 Actuator untuk healthcheck Docker
management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# 🧾 Logging dan debugging
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.agnesmaria.retail_service: DEBUG
  file:
    name: logs/retail-service.log
app:
  seed-data: false
