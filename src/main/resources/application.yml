server:
  port: 8081
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: retail-service

  datasource:
    url: jdbc:postgresql://postgres:5432/retail_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      INDENT_OUTPUT: true

# 🔗 Konfigurasi komunikasi antar service
inventory:
  api:
    url: ${INVENTORY_API_URL:http://inventory-service:8080}

# 🧾 Logging dan debugging
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.agnesmaria.retail_service: DEBUG

# 🩺 Aktifkan actuator endpoint (untuk debug mapping)
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    mappings:
      enabled: true
